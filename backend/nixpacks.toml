# Adds the tailscale binary to the build image and swaps the start command
# to scripts/start-with-tailscale.sh, which brings this container onto the
# same private Tailscale network as wherever Ollama is running (see
# ai/README.md's "self-hosted Ollama behind a private tunnel" option) before
# handing off to the actual app.
#
# `nixPkgs` here is additive — it does not replace whatever Nixpacks already
# auto-detects for Node from package.json; it just adds tailscale alongside it.
#
# Local dev is completely unaffected: `npm start` / `node server.js` still
# work exactly as before. Only Railway's build uses this file.
#
# If this ever needs to be rolled back (e.g. the build breaks), delete this
# file — Railway falls straight back to its normal auto-detected Node build
# with no other changes needed.
[phases.setup]
nixPkgs = ["tailscale"]

[start]
cmd = "sh scripts/start-with-tailscale.sh"
