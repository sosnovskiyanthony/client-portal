<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BrindLeaf — Admin</title>
<meta name="description" content="BrindLeaf admin dashboard." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#09090b" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="spotlight" id="spotlight"></div>
<div class="cursor" id="cursor">
  <div class="cursor-inner">
    <span class="cursor-tick tick-top"></span>
    <span class="cursor-tick tick-right"></span>
    <span class="cursor-tick tick-bottom"></span>
    <span class="cursor-tick tick-left"></span>
  </div>
  <span class="cursor-dot"></span>
  <span class="cursor-ring"></span>
  <span class="cursor-caret"></span>
</div>
<div class="coord-readout" id="coord-readout">
  <span id="coord-text">000, 000</span>
</div>
<div class="bg-grid"></div>

<!-- Account menu -->
<div class="menu-root">
  <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
    <span class="menu-toggle-line"></span>
    <span class="menu-toggle-line"></span>
    <span class="menu-toggle-line"></span>
  </button>
  <div class="menu-dropdown" id="menu-dropdown" hidden></div>
</div>

<!-- Auth modal -->
<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" type="button" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- Site navigation -->
<header class="nav-pill" id="nav-pill">
  <span class="nav-pill-dot"></span>
  <nav class="nav-tabs" aria-label="Main">
    <a class="nav-tab" href="index.html">Home</a>
    <a class="nav-tab" href="web-design-services.html">Web Design</a>
    <a class="nav-tab" href="seo.html">SEO</a>
    <a class="nav-tab" href="contact.html">Contact</a>
  </nav>
</header>

<main>
<!-- Login gate -->
<section class="admin-gate" id="admin-gate" hidden>
  <div class="admin-gate-card">
    <div class="admin-gate-icon">
      <svg width="22" height="22" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M5.5 7V4.8C5.5 3.25 6.75 2 8.3 2C9.85 2 11 3.25 11 4.8V7" stroke="currentColor" stroke-width="1.4"/></svg>
    </div>
    <h2 class="admin-gate-title">Admin access required</h2>
    <p class="admin-gate-desc">Sign in with an admin account to review submitted questionnaires and SEO requests.</p>
    <button class="btn btn-primary btn-large" id="btn-admin-login" type="button">Log In</button>
  </div>
</section>

<!-- Dashboard -->
<section class="admin-dashboard" id="admin-dashboard" hidden>
  <div class="admin-header">
    <div>
      <h1 class="admin-title">Submissions</h1>
      <p class="admin-sub" id="admin-sub" aria-live="polite">Loading…</p>
    </div>
    <div class="admin-header-actions">
      <div class="ollama-control" id="ollama-control" hidden>
        <span class="ollama-status" id="ollama-status-dot" aria-hidden="true"></span>
        <span id="ollama-status-text">Ollama: checking…</span>
        <button class="btn btn-ghost" id="ollama-toggle-btn" type="button" hidden>Start</button>
      </div>
      <button class="btn btn-ghost" id="new-analysis-btn" type="button">New Analysis from Pasted Info</button>
      <button class="btn btn-ghost" id="cleanup-orphans-btn" type="button">Clean Up Files</button>
      <button class="btn btn-ghost" id="export-csv-btn" type="button">Export CSV</button>
      <button class="btn btn-ghost" id="btn-admin-logout" type="button">Log out</button>
    </div>
  </div>

  <div class="admin-filters" id="admin-filters">
    <button class="pill selected" data-filter="all" type="button">All</button>
    <button class="pill" data-filter="web-design" type="button">Web Design</button>
    <button class="pill" data-filter="seo" type="button">SEO</button>
    <button class="pill" data-filter="contact" type="button">Contact</button>
  </div>

  <div class="submission-list" id="submission-list"></div>
  <div class="admin-pagination" id="admin-pagination"></div>
</section>
</main>

<!-- AI chat drawer — see js/chat.js. Opened either scoped to a submission
     (data-chat-id set, "Chat with AI" on a submission's analysis section)
     or standalone (data-chat-id absent, "New Analysis from Pasted Info" in
     the dashboard header) — the same drawer, different visible sections,
     since both modes ultimately drive the same paste-and-analyze pipeline. -->
<div class="chat-drawer-overlay" id="chat-drawer-overlay" hidden>
  <div class="chat-drawer" id="chat-drawer" role="dialog" aria-modal="true" aria-label="AI chat">
    <div class="chat-drawer-header">
      <div>
        <h2 class="chat-drawer-title" id="chat-drawer-title">AI Chat</h2>
        <p class="chat-drawer-sub" id="chat-drawer-sub"></p>
      </div>
      <button class="modal-close" id="chat-drawer-close" type="button" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="chat-thread" id="chat-thread"></div>

    <div class="chat-paste-panel" id="chat-paste-panel" hidden>
      <label class="chat-paste-label" for="chat-paste-input">Paste client info to analyze</label>
      <textarea class="field-input chat-paste-input" id="chat-paste-input" rows="8" placeholder="Paste an email, message, notes, or questionnaire responses from the client…"></textarea>
      <div class="chat-paste-standalone-fields" id="chat-paste-standalone-fields" hidden>
        <input class="field-input" type="text" id="chat-paste-client-name" placeholder="Client name (optional)" />
        <input class="field-input" type="email" id="chat-paste-client-email" placeholder="Client email (optional)" />
      </div>
      <div class="chat-paste-actions">
        <button class="btn btn-ghost" id="chat-paste-cancel" type="button">Cancel</button>
        <button class="btn btn-primary" id="chat-paste-submit" type="button">Analyze</button>
      </div>
      <p class="chat-paste-error" id="chat-paste-error" aria-live="polite"></p>
    </div>

    <div class="chat-drawer-footer" id="chat-drawer-footer">
      <div class="chat-footer-actions">
        <button class="btn btn-ghost chat-paste-toggle" id="chat-paste-toggle" type="button">Paste client info to analyze</button>
        <button class="btn btn-ghost" id="chat-update-analysis-btn" type="button">Update Analysis from this Conversation</button>
      </div>
      <div class="chat-input-row">
        <textarea class="field-input chat-input" id="chat-input" rows="2" placeholder="Ask a follow-up, challenge a conclusion, or request a reconsideration…"></textarea>
        <div class="chat-send-buttons">
          <button class="btn btn-primary" id="chat-send-btn" type="button">Send</button>
          <button class="btn btn-ghost" id="chat-research-send-btn" type="button" hidden title="Lets the AI search the web if it decides that would help answer this">🔎 Research &amp; Send</button>
        </div>
      </div>
      <p class="chat-input-error" id="chat-input-error" aria-live="polite"></p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>&copy; 2026 BrindLeaf.</p>
</footer>

<script src="js/common.js"></script>
<script src="js/admin.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
