name: CI

# Deterministic gate — see backend/guardian/README.md. Every push and PR
# runs lint, tests+coverage, and a dependency audit; these are mandatory
# (a failure blocks the PR from showing green / blocks merge if branch
# protection requires this check). The optional AI-review job at the bottom
# never blocks — see its own comment for why.
on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  deterministic:
    name: Lint, tests, coverage, dependency audit
    runs-on: ubuntu-latest
    services:
      # servicesIntake.test.js and the other integration test files spawn
      # the real server against a real Postgres — matching that requirement
      # here, not mocking it away, so CI actually exercises the same code
      # path local `npm test` does.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: client_portal_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/client_portal_ci
      JWT_SECRET: ci-test-jwt-secret-not-a-real-secret
      ADMIN_EMAIL: admin@brindleaf.dev
      ADMIN_PASSWORD: brindleaf-admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests + coverage (gated on the measured baseline thresholds)
        run: npm run test:coverage

      # audit-level=high: a real, actionable severity threshold without
      # blocking CI on every low/moderate advisory in a transitive
      # dependency — see backend/guardian/README.md for how to react to a
      # finding here (review, don't blind-bump).
      - name: Dependency audit
        run: npm audit --audit-level=high

  # Advisory only — see backend/guardian/reviewCli.js and rules.js. Runs on
  # every push/PR but is expected to usually report "unavailable": GitHub-
  # hosted runners have no Tailscale route to the owner's local Ollama
  # instance. A future self-hosted/Tailscale-connected runner could change
  # that; out of scope here. This job's own exit code is never allowed to
  # fail the workflow (continue-on-error), and guardian:ai itself already
  # exits 0 on an unavailable/errored review — see reviewCli.js.
  ai-review:
    name: Guardian AI review (advisory, non-blocking)
    runs-on: ubuntu-latest
    needs: deterministic
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "26.x"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Guardian AI review
        run: npm run guardian:ai -- --base origin/${{ github.event.repository.default_branch }}
